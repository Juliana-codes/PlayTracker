<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>Play Tracker</title>
<style>
  :root { --pad: 14px; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Arial, sans-serif; margin: var(--pad); }
  h2, h3 { margin: 8px 0; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .col { display:flex; flex-direction:column; gap:10px; }

  /* Mode toggle */
  .modes { display:flex; gap:8px; }
  .mode-btn {
    padding:10px 14px; border:1px solid #ddd; border-radius:999px; background:#f7f7f7;
    font-weight:700; cursor:pointer;
  }
  .mode-btn.active { background:#222; color:#fff; border-color:#222; }

  .card {
    border:1px solid #e7e7e7; border-radius:14px; padding:12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    background:#fff;
  }

  /* Plays (one column) */
  .plays { display:flex; flex-direction:column; gap:8px; }
  .play {
    padding:10px 12px; border:1px solid #ddd; border-radius:10px;
    cursor:pointer; background:#fafafa;
  }
  .play.selected { background:#e8f2ff; border-color:#6aa5ff; }

  /* Selection chips */
  .chip-row { display:flex; gap:10px; flex-wrap:wrap; }
  .chip {
    padding:12px 14px; border-radius:12px; border:1px solid #ddd;
    background:#f6f6f6; font-weight:800; cursor:pointer; user-select:none;
  }
  .chip.good.selected  { background:#e8f7ee; border-color:#2ecc71; }
  .chip.bad.selected   { background:#ffe9e9; border-color:#ff6b6b; }
  .chip.paint.selected { background:#fff4e0; border-color:#f39c12; }
  .chip.result.selected { outline:2px solid #555; }
  .chip.sub.selected   { background:#e8f2ff; border-color:#6aa5ff; }

  /* Submit button fixed */
  .submit-wrap {
    position:fixed; right:12px; bottom:12px; z-index:10;
  }
  .submit {
    padding:14px 18px; border:none; border-radius:999px;
    font-size:18px; font-weight:900;
    background:#111; color:#fff; cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
  }
  .submit:disabled { opacity:0.5; cursor:not-allowed; }

  /* Log */
  .log { margin-top:14px; }

  .log-row {
    display:grid;
    grid-template-columns: 2fr 1fr 1fr 1fr; /* Play | Grade | Result | Paint */
    gap:8px;
    align-items:center;
    border-bottom:1px dashed #eee;
    padding:8px 0;
    font-size:14px;
  }

  /* Good / Bad row coloring */
  .log-row.good { background:#e8f7ee; }
  .log-row.bad  { background:#ffe9e9; }

  .log-header {
    font-weight:800;
    border-bottom:1px solid #ddd;
    padding-bottom:6px;
    margin-bottom:4px;
    background:#fff !important;
  }

  /* Period header row */
  .period-header {
    grid-column:1 / 5;
    text-align:center;
    font-weight:800;
    background:#f0f0f0 !important;
    padding:4px 0;
    border-bottom:1px solid #ddd;
    margin-top:4px;
  }

  .muted { color:#777; font-size:12px; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .btn-sm {
    padding:8px 10px; border-radius:10px; border:1px solid #ddd;
    background:#f7f7f7; font-weight:700; cursor:pointer;
  }

  .grid {
    display:grid;
    grid-template-columns: 1fr;
    gap:12px;
  }
  @media(min-width: 800px){
    .grid { grid-template-columns: 1fr 1fr; }
  }
  /* possession number — same gray as period label */
  .pos-num {
      color: #777;
      font-weight: 700;
  }

  /* larger period label */
  #periodNow {
      font-size: 16px;
      font-weight: 900;
  }

  /* number + play alignment */
  .play-cell {
      display: grid;
      grid-template-columns: 40px auto;
      align-items: center;
  }
  .play-name { }

</style>
</head>
<body>

<div class="row" style="align-items:center; justify-content:space-between;">
  <h2>Play Tracker</h2>
  <div id="saveState" class="muted">Saved</div>
</div>

<div class="card">
  <div class="row" style="align-items:center; justify-content:space-between;">
    <div>
      <div class="modes">
        <button id="modeZone" class="mode-btn">Zone</button>
        <button id="modeMan" class="mode-btn">Man-to-man</button>
        <button id="prevPeriodBtn" class="mode-btn">Prev Q/OT</button>
        <button id="nextPeriodBtn" class="mode-btn">Next Q/OT</button>
      </div>

      <div class="muted" style="margin-top:6px;">
        Current period: <span id="periodNow"></span>
      </div>
    </div>
    <div class="controls">
      <button class="btn-sm" onclick="exportCSV()">Export CSV</button>
      <button class="btn-sm" onclick="nextPeriod()">Next Q/OT</button>
      <button class="btn-sm" onclick="endGame()">End Game</button>
    </div>
  </div>
</div>

<div class="grid">
  <!-- Plays -->
  <div class="card">
    <h3>Plays</h3>
    <div id="plays" class="plays"></div>
  </div>

  <!-- Selection -->
  <div class="card">
    <h3>Selection</h3>
    <div class="col">
      <div class="chip-row">
        <div id="goodBtn"  class="chip good">Good</div>
        <div id="badBtn"   class="chip bad">Bad</div>
        <div id="paintBtn" class="chip paint">Paint touch</div>
      </div>

      <div>
        <div class="muted" style="margin:6px 0 8px;">Result</div>
        <div class="chip-row">
          <div class="chip result" data-result="+2">+2</div>
          <div class="chip result" data-result="-2">-2</div>
          <div class="chip result" data-result="+3">+3</div>
          <div class="chip result" data-result="-3">-3</div>
          <div class="chip result" data-result="Fouled">Fouled</div>
          <div class="chip result" data-result="TO">TO</div>
        </div>
      </div>

      <!-- Sub-tag selector -->
      <div>
        <div class="muted" style="margin:10px 0 6px;">Play detail (1–10, except Transition)</div>
        <div id="subChips" class="chip-row"></div>
      </div>
    </div>
  </div>
</div>

<!-- Submit -->
<div class="submit-wrap">
  <button id="submitBtn" class="submit" disabled>Submit</button>
</div>

<!-- Log -->
<div class="log card">
  <h3>Log (most recent at top)</h3>
  <div id="logList"></div>
</div>

<script>
  // ---- Config ----
  const PLAYS = {
    'Zone': ['Transition', 'Zone', 'Triangle','X','Middle','BLOBs','SLOBs'],
    'Man-to-man': ['Transition','Spots','Quick hitters','Horns','BLOBs','SLOBs']
  };

  // NEW: hard-coded 1–10 options per play (except Transition)
  // Later you can change '1','2',... to 'Lopes up','4-high', etc.
  const SUB_OPTIONS = {
    'Triangle':      [],
    'X':             [],
    'Middle':        [],
    'Zone':          ['Double Drag', 'Overload'],
    'BLOBs':         ['4 High','Lopes up','2','4','4 Run it right','Box','Double Stack','Lopes up Run it right','TarHeel','10'],
    'SLOBs':         ['Canes','Canes Run it right','EOG Slob','Lakers EOG','Zipper Ghost Flare'],
    'Spots':         ['DHO continuous','Away','Dribble Reverse','Drag 5','Stagger','You Go I Go'],
    'Quick hitters': ['Vegas','C','Double Drag','Double Drag Get','Dribble at Drag','Ear','Ear Run it right','Flat','Floppy','Gucci','Hurry up', 'Mount', 'Stack'],
    'Horns':         ['Twist','Run it right','Out','Quick']
    // Transition intentionally left out → no sub-tag
  };

  const KEY = 'play_tracker_v1';

  // ---- State ----
  let S = load();
  let ui = {
    mode: S.mode || 'Zone',
    selectedPlay: null,
    grade: null,
    result: null,
    paintTouches: 0,
    subTag: null   // label string like '1', later 'Lopes up' etc.
  };

  // ---- Storage helpers ----
  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return { mode:'Zone', log:[], period:1 };
      const obj = JSON.parse(raw);
      obj.mode   ||= 'Zone';
      obj.log    ||= [];
      obj.period = typeof obj.period === 'number' ? obj.period : 1;
      return obj;
    } catch {
      return { mode:'Zone', log:[], period:1 };
    }
  }
  function save(){
    localStorage.setItem(KEY, JSON.stringify(S));
    setSaved();
  }
  let saveTimer=null;
  function setSaving(){
    clearTimeout(saveTimer);
    document.getElementById('saveState').textContent='Saving…';
  }
  function setSaved(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      document.getElementById('saveState').textContent='Saved';
    },300);
  }

  function periodLabel(p){
    if (p <= 4) return 'Q' + p;
    return 'OT' + (p - 4);
  }

  // A play needs sub-tags only if it's in SUB_OPTIONS
  function playNeedsSub(play){
    return !!SUB_OPTIONS[play];
  }

  // ---- UI wiring ----
  const modeZone   = document.getElementById('modeZone');
  const modeMan    = document.getElementById('modeMan');
  const prevPeriodBtn = document.getElementById('prevPeriodBtn');
  const nextPeriodBtn = document.getElementById('nextPeriodBtn');
  const playsEl    = document.getElementById('plays');
  const goodBtn    = document.getElementById('goodBtn');
  const badBtn     = document.getElementById('badBtn');
  const paintBtn   = document.getElementById('paintBtn');
  const submitBtn  = document.getElementById('submitBtn');
  const logList    = document.getElementById('logList');
  const periodNowE = document.getElementById('periodNow');
  const subChipsEl = document.getElementById('subChips');

  modeZone.addEventListener('click', ()=>setMode('Zone'));
  modeMan .addEventListener('click', ()=>setMode('Man-to-man'));
  nextPeriodBtn.addEventListener('click', nextPeriod);
  prevPeriodBtn.addEventListener('click', prevPeriod);

  goodBtn.addEventListener('click', ()=>{
    ui.grade = (ui.grade==='Good') ? null : 'Good';
    renderSelectors();
    checkReady();
  });
  badBtn.addEventListener('click', ()=>{
    ui.grade = (ui.grade==='Bad') ? null : 'Bad';
    renderSelectors();
    checkReady();
  });
  paintBtn.addEventListener('click', ()=>{
    ui.paintTouches = (ui.paintTouches || 0) + 1;
    renderSelectors();
  });

  document.querySelectorAll('.chip.result').forEach(ch => {
    ch.addEventListener('click', ()=>{
      const val = ch.dataset.result;
      ui.result = (ui.result===val) ? null : val;
      renderSelectors();
      checkReady();
    });
  });

  submitBtn.addEventListener('click', submitPlay);

  function setMode(m){
    ui.mode = m;
    S.mode = m;
    ui.selectedPlay = null;
    ui.grade = null;
    ui.result = null;
    ui.paintTouches = 0;
    ui.subTag = null;
    setSaving(); save();
    render();
  }

  function nextPeriod(){
    S.period = (S.period || 1) + 1;
    ui.subTag = null;
    setSaving(); save();
    render();
  }

  function prevPeriod(){
    // Don't go below Q1
    if ((S.period || 1) <= 1) {
        alert("Can't go back before Q1.");
        return;
    }

    S.period = (S.period || 1) - 1;
    ui.subTag = null;
    setSaving();
    save();
    render();
  }

  function endGame(){
    if (!confirm('Export and end game?')) return;

    // 1. Export CSV BEFORE clearing
    exportCSV();

    // 2. Reset game back to Q1, clear log
    S.log = [];
    S.period = 1;
    ui.selectedPlay = null;
    ui.grade = null;
    ui.result = null;
    ui.paintTouches = 0;
    ui.subTag = null;

    setSaving();
    save();
    render();
  }

  // ---- Renderers ----
  function render(){
    periodNowE.textContent = periodLabel(S.period);

    modeZone.classList.toggle('active', ui.mode==='Zone');
    modeMan .classList.toggle('active', ui.mode==='Man-to-man');

    playsEl.innerHTML = '';
    PLAYS[ui.mode].forEach(name=>{
      const item = document.createElement('div');
      item.className = 'play' + (ui.selectedPlay===name ? ' selected' : '');
      item.textContent = name;
      item.addEventListener('click', ()=>{
        if (ui.selectedPlay === name) {
          ui.selectedPlay = null;
          ui.subTag = null;
        } else {
          ui.selectedPlay = name;
          ui.subTag = null;
        }
        renderPlays();
        renderSubOptions();
        checkReady();
      });
      playsEl.appendChild(item);
    });

    renderSelectors();
    renderSubOptions();
    renderLog();
    checkReady();
  }

  function renderPlays(){
    [...playsEl.children].forEach(child=>{
      child.classList.toggle('selected', child.textContent===ui.selectedPlay);
    });
  }

  function renderSelectors(){
    goodBtn.classList.toggle('selected', ui.grade==='Good');
    badBtn .classList.toggle('selected', ui.grade==='Bad');

    const count = ui.paintTouches || 0;
    paintBtn.classList.toggle('selected', count > 0);
    paintBtn.textContent = count > 0 ? `Paint touch (${count})` : 'Paint touch';

    document.querySelectorAll('.chip.result').forEach(ch=>{
      ch.classList.toggle('selected', ui.result===ch.dataset.result);
    });
  }

  function renderSubOptions(){
    subChipsEl.innerHTML = '';

    if (!ui.selectedPlay) {
      const msg = document.createElement('div');
      msg.className = 'muted';
      msg.textContent = 'Select a play (except Transition) to choose 1–10.';
      subChipsEl.appendChild(msg);
      return;
    }

    const opts = SUB_OPTIONS[ui.selectedPlay];
    if (!opts) {
      // No sub-options for this play (e.g., Transition)
      const msg = document.createElement('div');
      msg.className = 'muted';
      msg.textContent = 'No extra detail needed for this play.';
      subChipsEl.appendChild(msg);
      return;
    }

    // Render hard-coded options (currently '1'...'10')
    opts.forEach(label => {
      const chip = document.createElement('div');
      chip.className = 'chip sub' + (ui.subTag === label ? ' selected' : '');
      chip.textContent = label;
      chip.addEventListener('click', ()=>{
        ui.subTag = (ui.subTag === label) ? null : label;
        renderSubOptions();
        checkReady();
      });
      subChipsEl.appendChild(chip);
    });
  }

  function checkReady(){
    const needsSub = playNeedsSub(ui.selectedPlay);
    const ok = !!(
      ui.selectedPlay &&
      ui.grade &&
      ui.result &&
      (!needsSub || ui.subTag !== null)
    );
    submitBtn.disabled = !ok;
  }

  // ---- Submit / Log ----
  function submitPlay(){
    if (!ui.selectedPlay || !ui.grade || !ui.result) return;
    const needsSub = playNeedsSub(ui.selectedPlay);
    if (needsSub && ui.subTag === null) return;

    // possessions numbered by count of possession entries PER PERIOD
    const num = S.log.filter(e => 
      (!e.type || e.type === 'possession') && e.period === S.period
    ).length + 1;

    const entry = {
      type: 'possession',
      n: num,
      ts: Date.now(),
      period: S.period || 1,
      mode: ui.mode,
      play: ui.selectedPlay,
      subTag: needsSub ? ui.subTag : null,   // label string
      grade: ui.grade,
      result: ui.result,
      paintTouches: ui.paintTouches || 0
    };
    S.log.push(entry);
    setSaving(); save();

    ui.selectedPlay = null;
    ui.grade = null;
    ui.result = null;
    ui.paintTouches = 0;
    ui.subTag = null;
    render();
  }

  function renderLog(){
    const items = [...S.log].reverse(); // most recent at top
    logList.innerHTML = '';

    // Column headers
    const header = document.createElement('div');
    header.className = 'log-row log-header';
    header.innerHTML = `
      <div>Play (# per period)</div>
      <div>Grade</div>
      <div>Result</div>
      <div>Paint</div>
    `;
    logList.appendChild(header);

    let currentPeriodHeader = null;

    items.forEach(e => {
      const period = typeof e.period === 'number' ? e.period : 1;

      // Insert period header whenever the period changes (in reversed order)
      if (period !== currentPeriodHeader) {
        currentPeriodHeader = period;
        const ph = document.createElement('div');
        ph.className = 'log-row';
        const inner = document.createElement('div');
        inner.className = 'period-header';
        inner.textContent = periodLabel(period);
        ph.appendChild(inner);
        logList.appendChild(ph);
      }

      if (e.type && e.type !== 'possession') return;

      const touches = typeof e.paintTouches === 'number'
        ? e.paintTouches
        : (e.paint ? 1 : 0);

      const row = document.createElement('div');
      row.className = 'log-row ' + (e.grade === 'Good' ? 'good' : 'bad');

      const labelPlay = (e.subTag != null)
        ? `${e.play}: ${e.subTag}`
        : e.play;

      row.innerHTML = `
        <div class="play-cell">
          <span class="pos-num">${e.n}</span>
          <span class="play-name">${labelPlay}</span>
        </div>
        <div>${e.grade}</div>
        <div>${e.result}</div>
        <div>${touches}</div>
      `;
      logList.appendChild(row);
    });
  }

  // ---- CSV / Utils ----
  function clearLog(){
    if (!confirm('Clear all logged plays?')) return;
    S.log = [];
    setSaving(); save();
    renderLog();
  }

  function exportCSV(){
    const header = 'n,timestamp,period,mode,play,sub_tag,grade,result,paint_touches\n';
    const rows = S.log
      .filter(e => !e.type || e.type === 'possession')
      .map(e => {
        const touches = typeof e.paintTouches === 'number'
          ? e.paintTouches
          : (e.paint ? 1 : 0);
        const period = typeof e.period === 'number' ? e.period : 1;
        const sub = (e.subTag != null) ? e.subTag : '';
        return `${e.n},${new Date(e.ts).toISOString()},${periodLabel(period)},${csv(e.mode)},${csv(e.play)},${sub},${csv(e.grade)},${csv(e.result)},${touches}`;
      }).join('\n');
    const blob = new Blob([header+rows+'\n'], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date().toISOString().replace(/[:T]/g,'-').slice(0,16);
    a.href = url; a.download = `gameplaylog_${now}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function csv(s){ return (''+s).replaceAll('"','""'); }

  // ---- boot ----
  render();
</script>
</body>
</html>
